trigger:
- main

pool:
  name: Babaji   # self-hosted agent

steps:
# -------------------------------
# Basic sanity steps
# -------------------------------
- script: echo Hello, world!
  displayName: '🔹 Sanity Check: Hello World'

- script: |
    echo Starting Terraform pipeline
    echo Repo checked out successfully
  displayName: '🔹 Sanity Check: Repo & Agent Ready'


# -------------------------------
# Terraform Install
# -------------------------------
- task: TerraformInstaller@1
  displayName: '🧩 Install Terraform (Latest)'
  inputs:
    terraformVersion: 'latest'


# -------------------------------
# Terraform INIT
# -------------------------------
- task: TerraformTask@5
  displayName: '🚀 Terraform INIT (Backend Setup)'
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'ado-terraform-sp'
    backendAzureRmOverrideSubscriptionID: '03f880af-35ca-4446-baab-0a4d320d633f'
    backendAzureRmResourceGroupName: 'yash-ADO'
    backendAzureRmStorageAccountName: 'asustuf'
    backendAzureRmContainerName: 'asustuf'
    backendAzureRmKey: 'terraform.tfstate'


# -------------------------------
# Terraform VALIDATE
# -------------------------------
- task: TerraformTask@5
  displayName: '✅ Terraform VALIDATE (Syntax Check)'
  inputs:
    provider: 'azurerm'
    command: 'validate'


# -------------------------------
# Terraform PLAN
# -------------------------------
- task: TerraformTask@5
  displayName: '📋 Terraform PLAN (Preview Changes)'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'ado-terraform-sp'
    environmentAzureRmOverrideSubscriptionID: '03f880af-35ca-4446-baab-0a4d320d633f'


# -------------------------------
# Terraform APPLY
# -------------------------------
- task: TerraformTask@5
  displayName: '🔥 Terraform APPLY (Deploy to Azure)'
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: 'ado-terraform-sp'
    environmentAzureRmOverrideSubscriptionID: '03f880af-35ca-4446-baab-0a4d320d633f'
