# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'


- task: TerraformInstaller@1
  inputs:
    terraformVersion: 'latest'

- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'init'
    backendServiceArm: 'ado-terraform-sp'
    backendAzureRmOverrideSubscriptionID: '03f880af-35ca-4446-baab-0a4d320d633f'
    backendAzureRmResourceGroupName: 'yash-ADO'
    backendAzureRmStorageAccountName: 'asustuf'
    backendAzureRmContainerName: 'asustuf'
    backendAzureRmKey: 'terraform.tfstate'



- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'validate'


- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'ado-terraform-sp'
    environmentAzureRmOverrideSubscriptionID: '03f880af-35ca-4446-baab-0a4d320d633f'


- task: TerraformTask@5
  inputs:
    provider: 'azurerm'
    command: 'apply'
    environmentServiceNameAzureRM: 'ado-terraform-sp'
    environmentAzureRmOverrideSubscriptionID: '03f880af-35ca-4446-baab-0a4d320d633f'

