name: AZ-infra-Pipeline
trigger: none
pool: Babaji

stages:
  - stage: PlanningStage
    displayName: Planning Stage
    jobs:
      - job: PlanningJob
        displayName: Planning Job 
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
              backendServiceArm: 'ado-cicd'
              backendAzureRmOverrideSubscriptionID: 'a60aa6b9-597f-4824-8c46-46d7412439d3'
              backendAzureRmResourceGroupName: 'infrargdev'
              backendAzureRmStorageAccountName: 'infrastgdevo'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev.terraform.tfstate'

          - task: TerraformTask@5
            displayName: Terraform Plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
              environmentServiceNameAzureRM: 'ado-cicd'

          - task: TerraformTask@5
            displayName: Terraform Fmt
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
              outputTo: 'console'
              customCommand: 'fmt'
              environmentServiceNameAzureRM: 'ado-cicd'

          - task: TerraformTask@5
            displayName: Terraform Validate
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'

  - stage: ManualValidationStage
    displayName: Manual Validation Stage
    pool: server 
    jobs:
      - job: ManualValidationJob
        displayName: Manual Validation Job
        steps:
          - task: ManualValidation@1
            displayName: Manual Validation
            inputs:
              notifyUsers: 'yashpal2035@gmail.com'
              approvers: 'yashpal2035@gmail.com'

  - stage: DeploymentStage
    displayName: Deployment Stage
    dependsOn: ManualValidationStage
    jobs:
      - job: DeploymentJob
        displayName: Deployment Job
        steps:
          - task: TerraformTask@5
            displayName: Terraform Init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
              backendServiceArm: 'ado-cicd'
              backendAzureRmOverrideSubscriptionID: 'a60aa6b9-597f-4824-8c46-46d7412439d3'
              backendAzureRmResourceGroupName: 'infrargdev'
              backendAzureRmStorageAccountName: 'infrastgdevo'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev.terraform.tfstate'

          - task: TerraformTask@5
            displayName: Terraform Apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
              environmentServiceNameAzureRM: 'ado-cicd'